syntax = "proto3";

package apiobserver.ingest.v1;

option go_package = "api-observer/proto/ingest/v1;ingestv1";

service IngestService {
  rpc Ingest(stream Job) returns (stream IngestAck);
}

message Job {
  string id = 1;

  JobType type = 2;
  Request request = 3;
  Response response = 4;
}

enum JobType {
  JOB_TYPE_UNSPECIFIED = 0;
  JOB_TYPE_REQUEST = 1;
  JOB_TYPE_RESPONSE = 2;
}

message Metadata {
  string request_id = 1;
  string source = 2;
}

message HeaderValues {
  repeated string values = 1;
}

message Request {
  string method = 1;
  string url = 2;
  map<string, HeaderValues> headers = 3;
  string body = 4;
  int64 content_length = 5;
  Metadata metadata = 6;
}

message Response {
  int32 status_code = 1;
  map<string, HeaderValues> headers = 2;
  string body = 3;
  int64 content_length = 4;
  Metadata metadata = 5;
}

enum IngestStatus {
  INGEST_STATUS_UNSPECIFIED = 0;
  INGEST_STATUS_ACCEPTED = 1;
  INGEST_STATUS_REJECTED = 2;
}

message IngestAck {
  string job_id = 1;
  IngestStatus status = 2;
  string message = 3;
  bool retryable = 4;
}
