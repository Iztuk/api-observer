openapi: 3.0.3
info:
  title: API Observer Security Test Service
  version: 1.0.0
  description: >
    Deliberately vulnerable synthetic API for controlled testing of API Observer
    against OWASP Top 10 categories A01 Broken Access Control, A02 Security
    Misconfiguration, A05 Injection, A07 Authentication Failures, and A09
    Security Logging and Alerting Failures. Do not expose this service to an
    untrusted network.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: health
  - name: auth
  - name: users
  - name: projects
  - name: tasks
  - name: search
  - name: files
  - name: reports
  - name: admin
  - name: audit
paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: Admin-only user listing
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: registerUser
      tags: [users]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewUser' }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getUser
      tags: [users]
      responses:
        '200':
          description: User
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateUser
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Admin-only user deletion
      responses:
        '204': { description: User deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/{id}/role:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      operationId: updateUserRole
      tags: [users]
      summary: Admin-only role change by contract
      description: >
        The implementation intentionally omits the admin authorization check for
        controlled A01 Broken Access Control testing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleUpdate' }
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      responses:
        '200':
          description: Projects owned by current user
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createProject
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewProject' }
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /projects/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProject
      tags: [projects]
      summary: Owner/admin-only project access by contract
      description: Implementation intentionally omits ownership checks for A01 testing.
      responses:
        '200':
          description: Project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateProject
      tags: [projects]
      description: Implementation intentionally omits ownership checks for A01 testing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectUpdate' }
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteProject
      tags: [projects]
      description: Implementation intentionally omits ownership checks for A01 testing.
      responses:
        '204': { description: Project deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{projectID}/tasks:
    parameters:
      - $ref: '#/components/parameters/ProjectIdNamed'
    get:
      operationId: listTasks
      tags: [tasks]
      responses:
        '200':
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createTask
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewTask' }
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      operationId: getTask
      tags: [tasks]
      responses:
        '200':
          description: Task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateTask
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskUpdate' }
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteTask
      tags: [tasks]
      responses:
        '204': { description: Task deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /search/users:
    get:
      operationId: searchUsers
      tags: [search]
      description: >
        Deliberately uses unsafe SQL string construction against the disposable
        local SQLite users table for controlled A05 Injection testing.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Matching users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /search/projects:
    post:
      operationId: searchProjects
      tags: [search]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectSearchRequest' }
      responses:
        '200':
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /files:
    get:
      operationId: getFile
      tags: [files]
      description: >
        Accepts traversal-shaped input but does not read the host filesystem.
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Synthetic file result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /reports/{name}:
    get:
      operationId: generateReport
      tags: [reports]
      description: >
        Accepts command-injection-shaped path input but does not execute a shell.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Synthetic report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/debug:
    get:
      operationId: getAdminDebug
      tags: [admin]
      security: []
      description: Intentionally unauthenticated debug information for A02 testing.
      responses:
        '200':
          description: Debug information
          headers:
            X-Powered-By:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DebugInfo' }

  /admin/error:
    get:
      operationId: triggerAdminError
      tags: [admin]
      security: []
      description: Intentionally verbose synthetic 500 response for A02 testing.
      responses:
        '500':
          description: Synthetic internal error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalError' }

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      responses:
        '200':
          description: Statistics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/config:
    get:
      operationId: getAdminConfig
      tags: [admin]
      responses:
        '200':
          description: Configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigurationInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /audit/events:
    get:
      operationId: listAuditEvents
      tags: [audit]
      description: >
        Returns the application's intentionally incomplete audit log. Compare it
        with API Observer capture for A09 evaluation.
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectIdNamed:
      name: projectID
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        message: { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }

    LoginResponse:
      type: object
      required: [accessToken, expiresAt]
      properties:
        accessToken: { type: string }
        expiresAt: { type: string, format: date-time }

    NewUser:
      type: object
      required: [email, password, name]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        name: { type: string, minLength: 1, maxLength: 120 }

    UserUpdate:
      type: object
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        name: { type: string, minLength: 1, maxLength: 120 }

    RoleUpdate:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role: { type: string, enum: [standard, admin] }

    User:
      type: object
      required: [id, email, name, role, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [standard, admin] }
        createdAt: { type: string, format: date-time }

    NewProject:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }

    ProjectUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }

    Project:
      type: object
      required: [id, ownerID, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        ownerID: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        createdAt: { type: string, format: date-time }

    ProjectSearchRequest:
      type: object
      additionalProperties: false
      properties:
        query: { type: string }
        owner: { type: string }
        status: { type: string }

    NewTask:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        status: { type: string, enum: [open, in_progress, done], default: open }

    TaskUpdate:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        status: { type: string, enum: [open, in_progress, done] }

    Task:
      type: object
      required: [id, projectID, title, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        projectID: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [open, in_progress, done] }
        createdAt: { type: string, format: date-time }

    FileResult:
      type: object
      required: [path, content]
      properties:
        path: { type: string }
        content: { type: string }

    Report:
      type: object
      required: [name, generatedAt, content]
      properties:
        name: { type: string }
        generatedAt: { type: string, format: date-time }
        content: { type: string }

    AdminStats:
      type: object
      required: [users, projects, tasks]
      properties:
        users: { type: integer }
        projects: { type: integer }
        tasks: { type: integer }

    ConfigurationInfo:
      type: object
      properties:
        environment: { type: string }
        databaseHost: { type: string }
        databaseName: { type: string }
        debugEnabled: { type: boolean }
        logLevel: { type: string }

    DebugInfo:
      type: object
      properties:
        version: { type: string }
        environment: { type: string }
        runtime: { type: string }
        databasePath: { type: string }
        internalService: { type: string }
        debugEnabled: { type: boolean }

    InternalError:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
        exception: { type: string }
        stack: { type: string }
        query: { type: string }
        debug:
          type: object
          additionalProperties: true

    AuditEvent:
      type: object
      required: [id, type, method, path, status, timestamp]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        userID: { type: string, format: uuid }
        method: { type: string }
        path: { type: string }
        status: { type: integer }
        sourceIP: { type: string }
        message: { type: string }
        timestamp: { type: string, format: date-time }
