rules:
  request.health_endpoint_accessed:
    enabled: true
    applies_to:
      - request
    type: path
    description: Detect when the health endpoint is accessed.

    match:
      paths:
        - "/health"
      methods:
        - GET

    finding:
      title: Health endpoint accessed
      message: The health endpoint was requested.

  request.admin_endpoint_accessed:
    enabled: true
    applies_to:
      - request
    type: path
    description: Detect when the administrative statistics endpoint is accessed.

    match:
      paths:
        - "/admin/stats"
      methods:
        - GET

    finding:
      title: Admin endpoint accessed
      message: The administrative statistics endpoint was requested.

  request.user_created:
    enabled: true
    applies_to:
      - request
    type: path
    description: Detect user creation requests.

    match:
      paths:
        - "/users"
      methods:
        - POST

    finding:
      title: User creation requested
      message: A request was made to create a new user.

  request.project_created:
    enabled: true
    applies_to:
      - request
    type: path
    description: Detect project creation requests.

    match:
      paths:
        - "/projects"
      methods:
        - POST

    finding:
      title: Project creation requested
      message: A request was made to create a new project.

  request.task_created:
    enabled: true
    applies_to:
      - request
    type: path
    description: Detect task creation requests.

    match:
      paths:
        - "/projects/{projectID}/tasks"
      methods:
        - POST

    finding:
      title: Task creation requested
      message: A request was made to create a task.

  request.task_deleted:
    enabled: true
    applies_to:
      - request
    type: path
    description: Detect task deletion requests.

    match:
      paths:
        - "/tasks/{id}"
      methods:
        - DELETE

    finding:
      title: Task deletion requested
      message: A request was made to delete a task.
